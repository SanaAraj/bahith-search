name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv venv --python 3.11

      - name: Install dependencies
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r requirements.txt
          uv pip install pytest httpx ruff

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

  eval:
    name: Retrieval mini-eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv venv --python 3.11

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config.py') }}

      - name: Install dependencies
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r requirements.txt

      - name: Build indices (offline corpus)
        run: uv run python build_index.py --offline

      - name: Run mini-eval with regression gate
        run: uv run python -m eval.run_eval --k 5 --min-recall 0.8 --min-mrr 0.8 --save

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/results/
          if-no-files-found: ignore
